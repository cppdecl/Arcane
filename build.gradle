plugins {
    id 'java'
    id 'xyz.jpenilla.run-paper' version '2.3.1'
    id 'com.gradleup.shadow' version '9.3.0'
    id 'org.hidetake.ssh' version '2.12.0'
    id 'io.canvasmc.weaver.userdev' version '2.4.0-remap-SNAPSHOT'
}

group = 'cx.arcane'
version = '1.0'

repositories {
    mavenCentral()
    maven {
        name = 'papermc-repo'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    maven {
        name = 'Canvas'
        url = uri('https://maven.canvasmc.io/snapshots')
    }
    maven {
        name = 'AllesioDP'
        url = 'https://repo.alessiodp.com/snapshots/'
    }
    maven { url = 'https://repo.triumphteam.dev/snapshots' }
    maven { url = 'https://repo.panda-lang.org/releases' }
    maven { url = uri('https://repo.codemc.io/repository/maven-releases/') }
    maven { url = uri('https://repo.codemc.io/repository/maven-snapshots/') }
    maven { url = uri('https://repo.eternalcode.pl/snapshots') }

    maven {
        url = uri("https://repo.extendedclip.com/content/repositories/placeholderapi/")
    }

    maven{
        url = uri ("https://repo.fancyinnovations.com/releases")
    }

    repositories {
        maven { url 'https://jitpack.io' }
    }

    repositories {
        maven {
            url = uri("https://repo.opencollab.dev/main/")
        }
    }
}

dependencies {
    paperweight.canvasDevBundle '1.21.11-R0.1-SNAPSHOT', 'io.canvasmc.canvas'

    implementation 'com.alessiodp.libby:libby-paper:2.0.0-SNAPSHOT'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.1'
    implementation 'dev.triumphteam:triumph-gui-paper:4.0.0-SNAPSHOT'

    implementation 'dev.rollczi:litecommands-folia:3.10.10-SNAPSHOT'
    implementation 'dev.rollczi:litecommands-adventure:3.10.10-SNAPSHOT'

    implementation 'com.github.ben-manes.caffeine:caffeine:3.2.3'
    implementation 'com.github.ben-manes.caffeine:guava:3.2.3'
    implementation 'com.github.ben-manes.caffeine:jcache:3.2.3'
    annotationProcessor 'org.projectlombok:lombok:1.18.40'

    compileOnly 'io.netty:netty-transport:4.1.108.Final'
    compileOnly 'com.mojang:datafixerupper:5.0.28'
    compileOnly 'org.projectlombok:lombok:1.18.40'

    implementation 'club.minnced:discord-webhooks:0.8.4'
    implementation 'de.exlll:configlib-velocity:4.8.0'
    implementation 'com.zaxxer:HikariCP:7.0.2'
    implementation 'org.mariadb.jdbc:mariadb-java-client:3.3.3'
    implementation 'org.mindrot:jbcrypt:0.4'
    implementation 'net.dv8tion:JDA:6.2.1'
    implementation 'com.maxmind.geoip2:geoip2:5.0.2'
    implementation 'org.apache.commons:commons-compress:1.26.1'
    implementation 'com.bucket4j:bucket4j_jdk17-core:8.16.0'
    implementation 'com.google.genai:google-genai:1.4.1'

    compileOnly 'com.github.retrooper:packetevents-spigot:2.11.2'
    compileOnly "me.clip:placeholderapi:2.12.2"
    compileOnly 'net.luckperms:api:5.5'
    compileOnly 'de.oliver:FancyNpcs:2.9.2'
    compileOnly 'de.oliver:FancyHolograms:2.9.1'
    compileOnly 'com.github.NighterDevelopment:SmartSpawner:1.6.3'
    compileOnly 'org.geysermc.floodgate:api:2.2.4-SNAPSHOT'
    compileOnly 'org.geysermc.geyser:api:2.9.0-SNAPSHOT'
}

tasks {
    runServer {
        minecraftVersion '1.21'
    }
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release = targetJavaVersion
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('paper-plugin.yml') {
        expand props
    }
}

shadowJar {
    archiveClassifier = ''

    dependencies {
        include dependency('com.alessiodp.libby:.*')
    }

    relocate 'com.alessiodp.libby', 'cx.arcane.dependencies.libby'
}

build {
    dependsOn shadowJar
}

jar {
    enabled = false
}

ssh.settings {
    knownHosts = allowAnyHosts
}

remotes {
    ultraservers {
        host = 'trei.ultraservers.com'
        port = 60002
        user = 'vahsrb17.e7d94582'
        password = 'qzFyLQR9onU7teVHMk-%4VN)H}_*EBSIFZ$jSVBDNWNbdf5ep31x|7}V.wG1t2Nz'
    }
}

tasks.register('deploy') {
    dependsOn shadowJar

    doLast {
        ssh.run {
            session(remotes.ultraservers) {
                put from: shadowJar.archiveFile.get().asFile, into: '/plugins/update'
            }
        }
    }
}

tasks.withType(JavaCompile) {
    options.compilerArgs.add("-parameters")
}

build {
    finalizedBy deploy
}